    initial_posture: deployment_home
  - name: medium_circle
    trajectory: circle_yz_m2
    controller: cartesian_medium
    angular_speeds_rad_s: [0.4]
    twist_feedforward: [true]
    repeats: 2
    initial_posture: deployment_home
