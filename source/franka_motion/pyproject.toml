[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-motion"
version = "0.1.0"
description = "Simulator-independent FR3 motion references and experiment contracts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
planning = ["ruckig==0.17.3"]
preview = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["franka_motion*"]

[tool.setuptools.package-data]
franka_motion = ["config/*.yaml", "config/suites/*.yaml"]
