version: 1

name: nominal_ppo_robustness_calibration_final
baseline_policy: nominal_ppo

policies:
  nominal_ppo:
    checkpoint: ${FRANKA_RL_DATA_ROOT}/runs/logs/rsl_rl/franka_reach/2026-09-23_01-15-04_no_success_termination/model_299.pt
    description: PPO policy trained without domain randomization.

# One matched seed is intentional. This targeted sweep selects informative
# magnitudes using both outcome rates and continuous trajectory metrics. The
# selected scenarios should subsequently be frozen in a five-seed suite.
scenarios:
  - nominal
  - action_delay_1
  - effort_040
  - effort_030
  - stiffness_050
  - stiffness_075
  - stiffness_125
  - stiffness_150
  - link_mass_050
  - link_mass_070
  - link_mass_130
  - link_mass_150
  - observation_bias
  - observation_bias_2x
  - observation_bias_3x
  - ee_error_noise_020
  - ee_error_noise_030

seeds:
  - 123

evaluation:
  task: Template-Franka-Rl-v0
  num_envs: 128
  episodes_per_job: 256
  success_threshold: 0.03
  success_steps: 5
  device: cuda:0
  deterministic: true
  visualizer: none
  target_replay:
    enabled: true
    extra_episodes_per_env: 32
    position_ranges:
      x: [0.35, 0.60]
      y: [-0.20, 0.20]
      z: [0.20, 0.50]

scenario_file: null
