version: 1

name: nominal_ppo_robustness_calibration
baseline_policy: nominal_ppo

policies:
  nominal_ppo:
    checkpoint: ${FRANKA_RL_DATA_ROOT}/runs/logs/rsl_rl/franka_reach/2026-09-23_01-15-04_no_success_termination/model_299.pt
    description: PPO policy trained without domain randomization.

# One matched seed is intentional: this suite locates informative perturbation
# magnitudes. Freeze selected points in a separate five-seed final suite.
scenarios:
  - nominal
  - effort_080
  - effort_060
  - effort_040
  - damping_125
  - damping_150
  - damping_200
  - friction_add_010
  - friction_add_025
  - friction_add_050
  - link_mass_090
  - link_mass_110
  - link_inertia_080
  - link_inertia_120
  - armature_050
  - armature_200
  - observation_noise_test
  - observation_noise_medium
  - observation_noise_high
  - observation_bias
  - reset_joint_0125

seeds:
  - 123

evaluation:
  task: Template-Franka-Rl-v0
  num_envs: 128
  episodes_per_job: 256
  success_threshold: 0.03
  success_steps: 5
  device: cuda:0
  deterministic: true
  visualizer: none
  target_replay:
    enabled: true
    extra_episodes_per_env: 32
    position_ranges:
      x: [0.35, 0.60]
      y: [-0.20, 0.20]
      z: [0.20, 0.50]

scenario_file: null
