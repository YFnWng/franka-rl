version: 1

name: nominal_ppo_payload_calibration
baseline_policy: nominal_ppo

policies:
  nominal_ppo:
    checkpoint: ${FRANKA_RL_DATA_ROOT}/runs/logs/rsl_rl/franka_reach/2026-09-23_01-15-04_no_success_termination/model_299.pt
    description: PPO policy trained without payload randomization.

# A paired one-seed sweep to locate a useful payload range before DR training.
scenarios:
  - nominal
  - payload_025
  - payload_050
  - payload_100
  - payload_200

seeds:
  - 123

evaluation:
  task: Template-Franka-Rl-v0
  num_envs: 128
  episodes_per_job: 256
  success_threshold: 0.03
  success_steps: 5
  device: cuda:0
  deterministic: true
  visualizer: none
  target_replay:
    enabled: true
    extra_episodes_per_env: 32
    position_ranges:
      x: [0.35, 0.60]
      y: [-0.20, 0.20]
      z: [0.20, 0.50]

scenario_file: null
