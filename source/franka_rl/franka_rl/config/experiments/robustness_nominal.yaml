version: 1

name: nominal_ppo_full_robustness
baseline_policy: nominal_ppo

policies:
  nominal_ppo:
    checkpoint: ${FRANKA_RL_DATA_ROOT}/runs/logs/rsl_rl/franka_reach/2026-09-23_01-15-04_no_success_termination/model_299.pt
    description: PPO policy trained without domain randomization.

# The fixed seven-row protocol from IMPLEMENTATION_PLAN.md section 6.
scenarios:
  - nominal
  - effort_080
  - damping_125
  - friction_add_010
  - observation_noise_test
  - action_delay_1
  - action_delay_2

# Five paired seeds support seed dispersion and confidence intervals.
seeds:
  - 123
  - 456
  - 789
  - 1011
  - 1213

evaluation:
  task: Template-Franka-Rl-v0
  num_envs: 128
  episodes_per_job: 256
  success_threshold: 0.03
  success_steps: 5
  device: cuda:0
  deterministic: true
  visualizer: none
  target_replay:
    enabled: true
    extra_episodes_per_env: 32
    position_ranges:
      x: [0.35, 0.60]
      y: [-0.20, 0.20]
      z: [0.20, 0.50]

scenario_file: null
